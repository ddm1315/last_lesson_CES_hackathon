name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'

env:
  node_version: "22.x"
  FORCE_COLOR: 3

concurrency: ${{ github.ref }}

permissions:
  contents: read

jobs:
  build_and_release:
    name: Build and Release
    timeout-minutes: 90
    runs-on: [openshift-ocp-oit]
    env:
      IMAGE_NAME: quay.byu.edu/oit/ces-hackathon
    steps:
      - name: Setup git
        run: sudo apt-get update && sudo apt-get install -y git

      - name: Check out
        uses: actions/checkout@v7

      - name: Login to Quay
        id: login-quay
        uses: docker/login-action@v4.6.0
        with:
          registry: quay.byu.edu
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64

      - name: Build and push the Docker image
        id: build-push-image
        uses: docker/build-push-action@v7
        with:
          context: src
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get app token for notifying manifest repo
        id: app
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.K8S_APP_MANIFESTS_APP_ID }}
          private-key: ${{ secrets.K8S_APP_MANIFESTS_APP_PRIVATE_KEY }}
          owner: byu-oit

      - name: Notify the manifest repo
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ steps.app.outputs.token }}
          repository: byu-oit/k8s-app-manifests
          event-type: app-version-released
          client-payload: '
            {
              "appName":"ces-hackathon",
              "image":"${{ env.IMAGE_NAME }}:${{ github.sha }}",
              "sourceCommitSHA":"${{ github.sha }}",
              "environments": [
                {"name":"dev","autodeploy":true}
              ]
            }'

# Note: RFCs will happen when manifest PRs are merged at deploy time. No RFCs are needed here because no environments were deployed.
